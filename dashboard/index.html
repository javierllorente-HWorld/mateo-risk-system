<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panel de riesgo de solicitantes</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="container">
      <header class="header">
        <h1>Panel de riesgo de solicitantes</h1>
        <p class="muted">Vista simple para evaluar riesgo.</p>
      </header>

      <section class="card" id="app">
        <div class="row">
          <div>
            <div class="label">Solicitante</div>
            <div class="value" id="applicantName">—</div>
          </div>
          <div class="pill" id="decisionPill">—</div>
        </div>

        <div class="grid">
          <div class="field">
            <div class="label">Puntaje</div>
            <div class="value" id="score">—</div>
          </div>
          <div class="field">
            <div class="label">Decisión</div>
            <div class="value" id="decision">—</div>
          </div>
        </div>

        <div class="field">
          <div class="label">Resumen</div>
          <div class="value" id="summary">—</div>
        </div>

        <div class="field">
          <div class="label">Alertas</div>
          <ul class="list" id="flags"></ul>
        </div>
      </section>

      <footer class="footer muted">
        Datos desde <code>dashboard/data.json</code>.
      </footer>
    </main>

    <script type="module" src="./main.js"></script>
  </body>
</html>
