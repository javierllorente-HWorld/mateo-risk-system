<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panel de riesgo de solicitantes</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="container">
      <header class="header">
        <h1>Panel de riesgo de solicitantes</h1>
        <p class="muted">Vista simple para evaluar riesgo.</p>
      </header>

      <section class="card" id="app">
        <div class="hero">
          <div class="statusRow">
            <div class="label">Estado general</div>
            <div class="statusChip" id="generalStatus">—</div>
          </div>
          <div class="heroTop">
            <div>
              <div class="label">Decisión</div>
              <div class="decisionText" id="decisionText">—</div>
            </div>
            <div class="pill decisionPill" id="decisionPill">—</div>
          </div>
          <div class="heroMeta">
            <div class="metaItem">
              <div class="label">Puntaje</div>
              <div class="metaValue">
                <span class="scoreValue" id="score">—</span>
                <span class="scoreContext" id="scoreContext">—</span>
              </div>
            </div>
            <div class="metaItem">
              <div class="label">Solicitante</div>
              <div class="dropdown" id="applicantDropdown">
                <button class="dropdownTrigger" id="applicantTrigger" type="button" aria-haspopup="listbox" aria-expanded="false">
                  <span class="metaValue" id="applicantName">—</span>
                  <span class="chevron" aria-hidden="true">▾</span>
                </button>
                <div class="dropdownMenu" id="applicantMenu" role="listbox" aria-label="Elegir solicitante"></div>
              </div>
            </div>
          </div>
        </div>

        <section class="subcard" id="applicantDetails">
          <div class="subcardTitle">Datos del solicitante</div>
          <div class="detailsGrid">
            <div class="detail" data-field>
              <div class="label">Ingreso mensual</div>
              <div class="value" id="monthlyIncome">—</div>
            </div>
            <div class="detail" data-field>
              <div class="label">Monto solicitado</div>
              <div class="value" id="requestedAmount">—</div>
            </div>
            <div class="detail" data-field>
              <div class="label">Empleo</div>
              <div class="value" id="employmentStatus">—</div>
            </div>
            <div class="detail" data-field>
              <div class="label">Antigüedad laboral</div>
              <div class="value" id="monthsAtJob">—</div>
            </div>
          </div>
        </section>

        <div class="field">
          <div class="label">Resumen</div>
          <div class="value summary" id="summary">—</div>
        </div>

        <div class="field">
          <div class="label">Motivos</div>
          <ul class="list" id="reasons"></ul>
        </div>

        <div class="field">
          <div class="label">Señales de riesgo</div>
          <ul class="list" id="flags"></ul>
        </div>
      </section>

      <footer class="footer muted">
        Datos desde <code>dashboard/data.json</code>.
      </footer>
    </main>

    <script type="module" src="./main.js"></script>
  </body>
</html>
